[package]
name = "danfse-wasm"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
danfse-core = { path = "../core" }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# precisa casar com a versão do CLI wasm-bindgen usado no build
wasm-bindgen = "=0.2.126"
js-sys = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
