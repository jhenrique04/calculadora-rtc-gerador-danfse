version: '3'

vars:
  BIN_DIR: bin
  APP_NAME: danfse-service
  IMAGE_NAME: danfse-service

dotenv:
  - ".env"

tasks:
  default:
    desc: Lista as tarefas disponíveis
    cmd: task --list
    silent: true

  run:
    desc: Inicia o servidor (variáveis de ambiente e .env opcional)
    cmd: cargo run -p danfse-server

  test:
    desc: Roda todos os testes
    cmd: cargo test --workspace

  coverage:
    desc: Roda os testes e gera relatório de cobertura HTML (requer cargo-llvm-cov)
    cmd: cargo llvm-cov --workspace --html

  check:
    desc: Formata e analisa o projeto
    cmds:
      - cargo fmt --all
      - cargo clippy --workspace --all-targets -- -D warnings

  build:
    desc: Compila o binário para a plataforma atual
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cargo build --release -p danfse-server
      - cp target/release/danfse-server {{.BIN_DIR}}/{{.APP_NAME}}

  build-wasm:
    desc: Compila o WASM e gera o glue JS em bin/ (requer wasm-bindgen-cli)
    cmd: wasm/build.sh {{.BIN_DIR}}

  generate-localidades:
    desc: Regenera core/src/domain/localidade/data.rs a partir do catálogo JSON
    cmd: cargo run -p gen-localidades -- -input gen-localidades/localidades.json -output core/src/domain/localidade/data.rs

  docker:
    desc: Build da imagem Docker
    cmd: docker build -t {{.IMAGE_NAME}} .
